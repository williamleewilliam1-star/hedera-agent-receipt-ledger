name: Template Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile Solidity
        run: npm run hardhat:compile

      - name: Test AgentReceiptRegistry
        run: npm run hardhat:test

      - name: Typecheck Next.js
        run: npm run next:check-types

      - name: Build production app
        run: npm run next:build

      - name: Ensure tracked tree stays clean
        run: git diff --exit-code
